[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velpick"
version = "0.0.1"
description = "Seismic velocity picking workstation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
gui = ["PySide6", "pyqtgraph"]
plot = ["matplotlib"]
dev = ["pytest"]
gui-test = ["pytest-qt"]

[project.scripts]
velpick = "velpick.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
